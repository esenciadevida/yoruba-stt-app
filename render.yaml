services:
  # ─── Backend (FastAPI) ───
  - type: web
    name: bami-soro-backend
    region: oregon
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-host.txt gunicorn
    startCommand: sh -c 'exec gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT'
    healthCheckPath: /api/health
    envVars:
      # Secrets are never committed. Set these in the Render dashboard
      # (Service > Environment) or via `render.yaml` with `sync: false`.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://bami-soro-frontend.onrender.com,https://frontend-5vg8sippf-vidas-projects-536f5500.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_MAX_OVERFLOW
        value: 5
      - key: NLLB_MODEL
        value: facebook/nllb-200-distilled-600M

  # ─── Frontend (Next.js) ───
  - type: web
    name: bami-soro-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: sh -c 'exec npx next start -p $PORT'
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://bami-soro-backend.onrender.com
