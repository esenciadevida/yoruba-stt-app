services:
  # ─── Backend (FastAPI in Docker) ───
  - type: web
    name: bami-soro-backend
    region: oregon
    plan: free
    env: docker
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: postgresql+asyncpg://neondb_owner:npg_nIaowZ4sUS6q@ep-dawn-frog-b5liv8zt-pooler.c-7.us-east-2.aws.neon.tech/neondb
      - key: DATABASE_URL_SYNC
        value: postgresql+psycopg://neondb_owner:npg_nIaowZ4sUS6q@ep-dawn-frog-b5liv8zt.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        value: 3be704ea7ab1ba9da4df01dc2ca1779871527265aec204f0a08c031fd61aef37
      - key: OPENAI_API_KEY
        value: ""
      - key: CORS_ORIGINS
        value: https://bami-soro-frontend.onrender.com,https://frontend-5vg8sippf-vidas-projects-536f5500.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_MAX_OVERFLOW
        value: 5
      - key: NLLB_MODEL
        value: facebook/nllb-200-distilled-600M

  # ─── Frontend (Next.js) ───
  - type: web
    name: bami-soro-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://bami-soro-backend.onrender.com
